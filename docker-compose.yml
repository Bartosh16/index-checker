services:
  postgres:
    image: postgres:16-alpine
    container_name: index-checker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: index_checker
    ports:
      - "5432:5432"
    volumes:
      - index-checker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d index_checker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  index-checker-postgres:
